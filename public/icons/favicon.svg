<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nqGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3E36"/>
      <stop offset="100%" stop-color="#07221E"/>
    </linearGradient>
    <linearGradient id="nqGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D2B0"/>
      <stop offset="50%" stop-color="#B79A62"/>
      <stop offset="100%" stop-color="#8C6D37"/>
    </linearGradient>
    <filter id="nqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="108" fill="url(#nqGreen)"/>
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="url(#nqGold)" stroke-width="6" opacity="0.65"/>

  <!-- Quran Rehal / Open Book -->
  <g filter="url(#nqGlow)" transform="translate(256, 256)">
    <!-- Crescent Moon Accent -->
    <path d="M -40,-130 A 130,130 0 0 1 120,10 A 110,110 0 0 0 -20,-110 A 130,130 0 0 1 -40,-130 Z" fill="url(#nqGold)" opacity="0.9"/>
    
    <!-- Open Book Pages Left -->
    <path d="M -12,-30 C -60,-65 -130,-45 -140,-10 C -140,50 -130,85 -12,120 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Open Book Pages Right -->
    <path d="M 12,-30 C 60,-65 130,-45 140,-10 C 140,50 130,85 12,120 Z" fill="#FFFFFF" opacity="0.95"/>

    <!-- Rehal Base Left -->
    <path d="M -10,120 L -90,165 L -115,145 L -20,85 Z" fill="url(#nqGold)"/>
    <!-- Rehal Base Right -->
    <path d="M 10,120 L 90,165 L 115,145 L 20,85 Z" fill="url(#nqGold)"/>

    <!-- Islamic Star / Noor Rays -->
    <circle cx="0" cy="-65" r="14" fill="url(#nqGold)"/>
    <polygon points="0,-90 6,-74 22,-74 10,-63 15,-48 0,-57 -15,-48 -10,-63 -22,-74 -6,-74" fill="url(#nqGold)"/>
  </g>
</svg>